    trail: 70     # photo alone again after the text passes    fallback: "linear-gradient(180deg, #1b2a3a, #0f1a14)"
    media: {img: media/leavenworth2.jpg, alt: "Fort Leavenworth"}   # drop your own photo here
    steps:
      - text: text/fort-leavenworth.html


  - layout: overlay
