    lead: 90      # photo alone on screen for ~90vh of scrolling before the text arrives
    trail: 70     # photo alone again after the text passes    fallback: "linear-gradient(180deg, #1b2a3a, #0f1a14)"
    fallback: "linear-gradient(180deg, #1b2a3a, #0f1a14)"
