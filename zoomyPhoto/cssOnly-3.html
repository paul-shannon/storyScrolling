<!DOCTYPE html>
<html>
<head>
<style>

.image-container {
  overflow: hidden;
  width: 100%;
  height: 100%;
  position: relative;
}

.image-containr img  {
  transform: scale(2) translate(25%, 25%);
  transform-origin: 100% 0%; /* top-right corner */
  width: 100%;
  height: auto;
}

</style>
</head>
<body>

<h2>Using object-position</h2>


<div class="image-container">
  <img src="horsemen.jpg" width="800">
</div>

</body>
</html>
