<!DOCTYPE html>
<html>
<head>
<style>
.image-container {
  width: 800px
  height: 800px;
  border: 1px solid black;
}

.image-container img {
  transform-origin: 3cm 2cm;
    //transform: scale(2); 
}
</style>
</head>
<body>

<h2>Using object-position</h2>


<div class="image-container">
  <img src="horsemen.jpg" width="800">
</div>

<br>

<p>Original image:</p>
<img src="horsemen.jpg"  width="800">

</body>
</html>
