<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title> zoom and center</title>
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
<style>

body{
   margin: 100px;
   margin-top: 30px;
   font-family: "New York Times-Roman";
   font-size: 22px;
   height: 100%;
   }

.img-container {
  overflow: hidden; 
  margin: 0 auto;
  width: 800px; /* Fixed container width */
  height: auto;
  }

/* For 2x zoom: container at 50% of original size */
.img-container.zoom-2x {
    width: 400px; /* 800px / 2 */
}

/* For 3.5x zoom: container at ~28.57% of original size */
.img-container.zoom-3-5x {
    width: 228.57px; /* 800px / 3.5 */
}

.zoom-normal {
    transform: scale(1);
    transform-origin: 0% 0%;
    width: 100%;
    height: auto;
}

.zoom-top-right {
    transform: scale(2);
    transform-origin: 100% 0%;
    width: 100%;
    height: auto;
}

.zoom-low-left {
   transform: scale(2);
   transform-origin: 0% 100%;
   width: 100%;
   height: auto;
}

.zoom-tall-trees {
   transform: scale(3.5);
   transform-origin: 2% 33%;
   width: 100%;
   height: auto;
}
</style>
</head>
<body>
  <button id="normalZoomButton">default</button>
  <button id="zoomTopRightButton">zoom top right</button>
  <button id="zoomLowLeftButton">zoom low left</button>
  <button id="zoomTallTreesButton">zoom tall trees</button>
<br><br>              
<div class="img-container">
   <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" 
           alt="Original mountain landscape" 
           class="original-image zoom-normal">
</div>
<script>
$(document).ready(function(){
  console.log("document ready")
  
  // Store original width
  const originalWidth = 800;
  
  $("#zoomLowLeftButton").on("click", function(){
      $(".img-container img").removeClass().addClass('zoom-low-left');
      $(".img-container").removeClass().addClass('zoom-2x');
  })

  $("#zoomTopRightButton").on("click", function(){
      $(".img-container img").removeClass().addClass('zoom-top-right');
      $(".img-container").removeClass().addClass('zoom-2x');
  })

  $("#normalZoomButton").on("click", function(){
      $(".img-container img").removeClass().addClass('zoom-normal');
      $(".img-container").removeClass(); // Removes zoom-2x/zoom-3-5x classes
  })

  $("#zoomTallTreesButton").on("click", function(){
      $(".img-container img").removeClass().addClass('zoom-tall-trees');
      $(".img-container").removeClass().addClass('zoom-3-5x');
  })
});
</script>
</body>
</html>
