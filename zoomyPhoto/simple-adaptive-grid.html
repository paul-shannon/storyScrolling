<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>simple grid </title>
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
<style>

body{
   font-family: "New York Times-Roman";
   font-size: 22px;
   }

/* Basic styling for visibility */
.container > * {
  border: 2px solid #79b9e3;
  padding: 10px;
  border-radius: 5px;
  background-color: #cfffe6;
}

.container {
  display: grid;
  gap: 10px; /* Provides space between items */
  min-height: 97vh; /* Optional: ensures container takes full viewport height */
}

/* Default layout (mobile-first approach, a single column stack) */
.container {
  grid-template-areas:
    "header"
    "nav"
    "main"
    "aside"
    "footer";
  grid-template-columns: 1fr; /* One column that takes up all available space */
  grid-template-rows: auto auto 1fr auto auto; /* Auto-height for most, main content grows */
}

/* Assigning names to items */
header { grid-area: header; }
nav { grid-area: nav; }
main { grid-area: main; }
aside { grid-area: aside; }
footer { grid-area: footer; }

/* Adaptive layout for screens wider than 600px (e.g., tablet/desktop) */
@media (min-width: 600px) {
  .container {
    grid-template-areas:
      "header header header"
      "nav    main   aside"
      "footer footer footer";
    grid-template-columns: 150px 1fr 150px; /* Fixed width sidebars, growing content */
    grid-template-rows: auto 1fr auto; /* Auto height header/footer, growing middle row */
  }
}

</style>

<script>
$(document).ready(function(){
  console.log("document ready")
  });

</script>

</head>
<body>

<div class="container">
  <header>Header</header>
  <nav>Navigation</nav>
  <main>Main Content</main>
  <aside>Sidebar</aside>
  <footer>Footer</footer>
</div>

</body>
</html>
