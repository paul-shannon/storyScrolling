<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>simple grid </title>
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
<style>

body{
   font-family: "New York Times-Roman";
   font-size: 22px;
   }

.container > * {
  border: 2px solid #79b9e3;
  padding: 0px;
  border-radius: 5px;
  background-color: #cfffe6;
  }
.container > text {
  padding: 10px;
  }

.container {
  display: grid;
  gap: 10px; /* Provides space between items */
  min-height: 97vh; /* Optional: ensures container takes full viewport height */
  }

/* Default layout (mobile-first approach, a single column stack) */
.container {
  grid-template-areas:
    "media"
    "text";
  grid-template-columns: auto; 
  grid-template-rows: 1fr auto; 
  }

/* Assigning names to items */
media {grid-area: media;}
text  {grid-area: text;}

/* Adaptive layout for screens wider than 600px (e.g., tablet/desktop) */
@media (min-width: 600px) {
  .container {
    grid-template-areas:
        "media text";
    grid-template-columns: 1fr 250px;
    grid-template-rows: auto;
  }
}

</style>

<script>
$(document).ready(function(){
  console.log("document ready")
  });

</script>

</head>
<body>

<div class="container">
  <media>
    <div>
      <img src="horsemen.jpg" class="zoom-normal" style="object-fit: contain; width: 100%; height: 100%;">
    </div>
  </media>
  <text>text</text>
</div>

</body>
</html>
