   - section: 3
     associatedText: "<h3>Big Trees, Burned Bark</h3>
          Doug-firs start out as tiny seedlings – like the one
          pictured below – taking root in bare ground beneath an open
          sky after a stand-replacing fire.  They then live for
          centuries. <p>After 200 years, with thick furrowed bark, they
          can survive all but the most severe fires.  <p>The mature tree
          in the video, like many of its cousins, started life on the
          Seward (Lushootseed “sbəqʷábs“) peninsula after a huge
          regional fire in 1508. <p>The seedling pictured above shows
          how our big firs looked one year after that fire, sprouting
          on bare ground in mineralize soil beneath an open sky. In
          the concluding drone shot, our tree is at the center with a
          broken top, other big firs all around. <p>Another regional
          fire – not quite so severe – followed two hundred years
          later, in 1701. Our “class of 1500” firs had by then
          acquired thick, fire-resistant, deeply furrowed bark.  This
          second fire left the burn marks which we see today, 300
          years later. Almost everything else burned to the ground in
          that 1701 fire. <p>A hundred firs and a few cedars
          survived. The woody rhizomes of sword ferns, tucked away
          safely underground, probably allowed them to survive the
          fire as well."
     mainText: thinkingWithTheForest.html


