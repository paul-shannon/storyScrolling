<h4>Contra Kant</h4>
The grandiosity of Kant's transcendental deduction - that,
after Hume woke him from his slumbers, he realized he had no
foundation for knowledge.  He promoted human biological/cultural
a prioris (time, Euclidean space, causality) to transcendence.
And humankind to autonomy.
