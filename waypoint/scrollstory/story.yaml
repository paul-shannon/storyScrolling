title: Branch and Bone
scenes:
  - layout: full
    id: title
    fallback: "linear-gradient(160deg, #18261f, #2E6F40)"  
    heading: |-
          Leaf and Lung
          Branch and Bone
    subheading: |-
         Lessons from a small forest

  - layout: split
    id: firstForest
    fallback: "linear-gradient(180deg, #1b2a3a, #0f1a14)"
    media: {img: media/missouri-forest-with-small-stream.webp, alt: "Kansas forest"}   # drop your own photo here
    steps:
      - text: text/intro-kansas.html

  - layout: overlay
    id: currentForest
    fallback: "linear-gradient(180deg, #1b2a3a, #0f1a14)"
    media: {img: media/hatcheryTrail-healthy.jpeg, alt: "Seward Forest with hazelnuts"}   # drop your own photo here
    steps:
      - text: text/intro-seward.html

  - layout: split
    id: branchingPatterns
    fallback: "linear-gradient(180deg, #1b2a3a, #0f1a14)"
    media: {img: media/branchingPatternExample.jpeg, alt: "branching patternst"}
    steps:
      - text: text/branchingPatterns.html



