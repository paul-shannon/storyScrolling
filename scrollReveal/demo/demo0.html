<!DOCTYPE html>
<html>
<head><script src="https://unpkg.com/scrollreveal"></script></head>
<body style="font-family:sans-serif;padding:20px;">
    <div style="height:10vh;padding-top:40px;">Scroll down...</div>
    
    <div style="background:#f0f0f0;padding:60px;margin:40px 0;
                text-align:center;"
         class="fubar">
        This will fade up when you scroll!
    </div>
    
    <script>
      ScrollReveal().reveal('.fubar',{
            //origin: 'left',
            distance: '50px',
            duration: 4000
        });
          

;</script>
</body>
</html>
